name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
        exclude:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --locked --extra dev --extra ui --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run --no-sync ruff check src tests app scripts
      - name: Test offline workflows
        run: uv run --no-sync pytest -m "not network" --cov=dataharvest --cov-report=term-missing --cov-fail-under=80
      - name: CLI demonstration
        run: |
          uv run --no-sync dataharvest --version
          uv run --no-sync dataharvest workspace demo
          uv run --no-sync dataharvest projects
      - name: Repository hygiene
        run: python scripts/check_repository.py

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip uv
      - run: uv build
      - name: Install wheel outside checkout
        shell: bash
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheel-test/bin/dataharvest workspace demo --db /tmp/wheel-smoke.sqlite3
          /tmp/wheel-test/bin/python -c "from importlib.resources import files; assert (files('dataharvest') / 'dashboard.py').is_file()"
