name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
        exclude:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]"
      - name: Lint
        run: ruff check src tests app
      - name: Test (offline, recorded fixtures)
        run: pytest -q -m "not network" --cov=dataharvest --cov-report=term-missing
      - name: CLI smoke test
        run: |
          dataharvest --version
          dataharvest sources
          dataharvest schemas leads
          dataharvest projects
          dataharvest validate data/input/seed_companies.csv --schema leads --country BE --out audit.xlsx
